[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "calendar-countdown"
version = "0.1.0"
description = "轻量化日历倒计时桌面工具"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "开发者"}
]
dependencies = [
    "PySide6>=6.6",
    "lunardate>=0.2",
    "platformdirs>=4.0",
]

[project.scripts]
calendar-countdown = "main:main"
